function isLate(t){return t.status!=='Completed'&&t.status!=='Cancelled'&&t.due&&new Date(t.due)<new Date()}
function schedule(){return [...data.meetings].filter(m=>sameDay(m.at)).sort((a,b)=>new Date(a.at)-new Date(b.at))}
function orderTasks(arr){const rank={Critical:0,High:1,Medium:2,Low:3};return [...arr].sort((a,b)=>a.status==='Completed'&&b.status!=='Completed'?1:b.status==='Completed'&&a.status!=='Completed'?-1:(rank[a.priority]??4)-(rank[b.priority]??4)||new Date(a.due||'2999-01-01')-new Date(b.due||'2999-01-01'))}
function navButton(id,ico,label,count=''){return `<button data-action="navigate" data-id="${id}" class="navbtn ${ui.tab===id?'active':''}" aria-label="${label}">${icon(ico)}<span>${label}</span>${count?`<span class="counter">${count}</span>`:''}</button>`}
function stat(n,l,ico,s=''){return `<div class="stat"><div class="stat-top"><span>${l}</span><span class="iconbox">${icon(ico)}</span></div><strong>${n}<small>${s}</small></strong></div>`}
function taskRow(t){return `<div class="taskrow ${t.status==='Completed'?'completed':''}"><input aria-label="Mark ${esc(t.title)} complete" class="check" type="checkbox" data-action="toggle-task" data-id="${esc(t.id)}" ${t.status==='Completed'?'checked':''}/><div class="taskmain"><div class="tasktitle">${esc(t.title)}</div><div class="taskmeta"><span>${t.due?dateTime(t.due):t.targetDate?'Scheduled '+t.targetDate+(t.calendarTime?' · '+taskCalendarLabel(t):' · all day'):'No date set'}</span>${t.person?`<span>· ${esc(t.person)}</span>`:''}${t.estimate?`<span>· ${Number(t.estimate)} min</span>`:''}${t.demo?'<span class="tag">Sample</span>':''}${isLate(t)?'<span style="color:#d46a79;font-weight:800">Overdue</span>':''}</div></div><span class="priority ${esc(t.priority)}">${esc(t.priority)}</span>${v11TaskMenu(t)}</div>`}
function agenda(list){return list.length?list.map(m=>`<div class="agenda-item"><span class="agenda-dot"></span><div class="agenda-t"><strong>${esc(m.title)}</strong><small>${esc(m.location||'No location')}</small></div><div class="agenda-time">${dateTime(m.at,{hour:'numeric',minute:'2-digit'})}</div></div>`).join(''):`<div class="empty">${icon('calendar')}<br>No meetings for this day.</div>`}

function finalDateHeader(label){return `<div class="time-node"><span class="time-dot"></span><b>${esc(label)}</b></div>`}
function finalTimeline(){
  const tasks=data.tasks.filter(t=>t.status!=='Completed');
  const mode=ui.homeView||'Day';
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const todayTasks=tasks.filter(t=>t.due&&sameDay(t.due)).slice(0,3);
  const nextTasks=tasks.filter(t=>t.due&&new Date(t.due).toDateString()===tomorrow.toDateString()).slice(0,3);
  if(mode!=='Day')nextTasks.push(...tasks.filter(t=>!todayTasks.includes(t)&&!nextTasks.includes(t)).slice(0,mode==='Month'?7:4));
  const meetings=schedule().slice(0,3);
  const recent=data.instructions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);
  function taskRowSmall(t){return `<div class="time-row"><input type="checkbox" class="check" data-action="toggle-task" data-id="${esc(t.id)}" aria-label="Complete ${esc(t.title)}"><span>${esc(t.title)}</span><small>${t.due?dateTime(t.due,{day:'numeric',month:'short'}):'Unscheduled'}</small></div>`}
  function meetRowSmall(m){return `<div class="time-row"><span class="time-icon">${icon('calendar')}</span><span>${esc(m.title)}</span><small>${dateTime(m.at,{hour:'numeric',minute:'2-digit'})}</small></div>`}
  function instructionRow(r){return `<div class="time-row"><span class="time-icon coral">${icon('sparkles')}</span><span>${esc(r.text).slice(0,72)}${r.text.length>72?'…':''}</span><small>${dateTime(r.date,{day:'numeric',month:'short'})}</small></div>`}
  const buttons=['Day','Week','Month'].map(t=>`<button class="time-tab ${mode===t?'on':''}" data-action="home-period" data-id="${t}">${t}</button>`).join('');
  const todayHtml=todayTasks.length?todayTasks.map(taskRowSmall).join(''):'<p class="time-empty">No tasks due today — enjoy some focus time.</p>';
  const meetingHtml=meetings.length?`<div class="time-minilabel">Meetings</div>`+meetings.map(meetRowSmall).join(''):'';
  const nextHtml=nextTasks.length?nextTasks.map(taskRowSmall).join(''):'<p class="time-empty">Nothing due yet. Add a task when you’re ready.</p>';
  const pastHtml=recent.length?recent.map(instructionRow).join(''):'<p class="time-empty">Captured instructions will appear here.</p>';
  const upcomingLabel=mode==='Day'?'Tomorrow':mode==='Week'?'Upcoming this week':'Upcoming this month';
  return `<div class="timeline-head"><h1>Timeline</h1><div class="time-tabs">${buttons}</div></div><div class="timeline-body"><div class="time-rail">${finalDateHeader('Today')}<div class="time-card">${todayHtml}${meetingHtml}</div>${finalDateHeader(upcomingLabel)}<div class="time-card">${nextHtml}</div>${finalDateHeader('Instruction history')}<div class="time-card">${pastHtml}</div></div></div>`;
}

function v11TasksPage(){
 const tasks=Array.isArray(data.tasks)?data.tasks:[];
 const filter=ui.taskFilter||'All',priority=ui.taskPriority||'All',sort=ui.taskSort||'Due soon';
 const query=String(ui.taskQuery||'').trim().toLowerCase(),today=indiaDate();
 const dueDay=t=>taskCalendarDate(t)||'';
 const active=t=>t.status!=='Completed'&&t.status!=='Cancelled';
 const matches=t=>{
  if(query&&!([t.title,t.person,t.priority,t.status,t.note,t.description].some(v=>String(v||'').toLowerCase().includes(query))))return false;
  if(priority!=='All'&&t.priority!==priority)return false;
  const day=dueDay(t);
  if(filter==='Pending'&&!active(t))return false;
  if(filter==='Completed'&&t.status!=='Completed')return false;
  if(filter==='Cancelled'&&t.status!=='Cancelled')return false;
  if(filter==='Overdue'&&!(active(t)&&day&&day<today))return false;
  if(filter==='Today'&&!(active(t)&&day===today))return false;
  if(filter==='Upcoming'&&!(active(t)&&day>today))return false;
  return true;
 };
 const shown=tasks.filter(matches).slice().sort((a,b)=>{
  if(sort==='Newest')return String(b.createdAt||b.updatedAt||'').localeCompare(String(a.createdAt||a.updatedAt||''));
  if(sort==='Priority'){const weight={Critical:0,High:1,Medium:2,Normal:2,Low:3};return (weight[a.priority]??4)-(weight[b.priority]??4)||String(dueDay(a)||'9999').localeCompare(String(dueDay(b)||'9999'));}
  if(sort==='Title')return String(a.title||'').localeCompare(String(b.title||''));
  return String(dueDay(a)||'9999-12-31').localeCompare(String(dueDay(b)||'9999-12-31'));
 });
 const filters=['All','Pending','Today','Upcoming','Overdue','Completed','Cancelled'];
 const selection=(id,opts,value)=>`<select id="${id}" class="field" aria-label="${id==='task-priority-select'?'Filter priority':'Sort tasks'}">${opts.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 return `<div class="v11-tasks-page"><div class="v11-pagehead"><div><span class="eyebrow">TASK MANAGER</span><h1>Task Manager</h1><p>Track pending work, deadlines, priorities and completed tasks in one place.</p></div><button type="button" class="btn" data-action="open-modal" data-id="task">${icon('plus')} Add Task</button></div>
 <div class="v11-task-summary"><button data-action="task-open-filter" data-id="Pending"><strong>${tasks.filter(active).length}</strong><span>Pending</span></button><button data-action="task-open-filter" data-id="Today"><strong>${tasks.filter(t=>active(t)&&dueDay(t)===today).length}</strong><span>Due Today</span></button><button data-action="task-open-filter" data-id="Overdue"><strong>${tasks.filter(t=>active(t)&&dueDay(t)&&dueDay(t)<today).length}</strong><span>Overdue</span></button><button data-action="task-open-filter" data-id="Completed"><strong>${tasks.filter(t=>t.status==='Completed').length}</strong><span>Completed</span></button></div>
 <section class="v11-card"><div class="v11-task-tools"><label class="v11-task-search">${icon('search')}<input id="tasksearch" class="field" type="search" placeholder="Search tasks, people or details…" value="${esc(ui.taskQuery||'')}" aria-label="Search tasks"></label>${selection('task-priority-select',['All','Critical','High','Medium','Normal','Low'],priority)}${selection('task-sort-select',['Due soon','Priority','Newest','Title'],sort)}</div>
 <div class="v11-task-filterbar" role="group" aria-label="Task status filters">${filters.map(x=>`<button type="button" class="${filter===x?'active':''}" data-action="task-open-filter" data-id="${x}">${x}</button>`).join('')}</div>
 <p class="v11-list-count">${shown.length} task${shown.length===1?'':'s'} found</p><div class="v11-task-list">${shown.map(v11CompactTask).join('')||'<p class="v11-empty">No tasks match these filters. Your saved tasks are unchanged.</p>'}</div></section></div>`;
}

function googlePushMeeting(m){if(!m||!m.at){toast('Set a meeting time before pushing to Google Calendar.');return}const start=new Date(m.at);if(Number.isNaN(start.valueOf())){toast('Meeting time is invalid.');return}const body={title:m.title||'Meeting',start:start.toISOString(),end:new Date(start.getTime()+Math.max(15,Number(m.duration)||45)*60000).toISOString(),description:[m.agenda||'',m.attendees?'Attendees: '+m.attendees:'',m.meetUrl?'Meet: '+m.meetUrl:''].filter(Boolean).join('\n'),location:m.location||'',all_day:false};window.edaCloud.calendarCreate(body).then(ev=>{m.googleEventId=(ev&&ev.id)||null;logActivity('Meetings',m.id,m.title,'Pushed to Google Calendar',null,{googleEventId:m.googleEventId});persist();toast('Added to Google Calendar.')}).catch(err=>toast('Google Calendar push failed: '+err.message))}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function isoFromIstDateTime(dateStr,timeStr){const d=new Date(dateStr+'T'+timeStr+':00+05:30');return Number.isNaN(d.getTime())?null:d.toISOString()}
function taskCalendarBody(t){const date=taskCalendarDate(t);if(!date)return null;const desc=[t.person?'Person: '+t.person:'',t.status?'Status: '+t.status:'',t.priority?'Priority: '+t.priority:'',t.kind?'Type: '+t.kind:''].filter(Boolean).join('\n');if(t.calendarTime&&t.targetDate===date){const start=isoFromIstDateTime(date,t.calendarTime);if(start)return {title:t.title||'Task',start,end:new Date(new Date(start).getTime()+Math.max(15,Number(t.estimate)||30)*60000).toISOString(),description:desc,location:t.location||'',all_day:false};}return {title:t.title||'Task',start:date,end:addDays(date,1),description:desc,location:t.location||'',all_day:true}}
function meetingCalendarBody(m){if(!m.at)return null;const start=new Date(m.at);if(Number.isNaN(start.valueOf()))return null;return {title:m.title||'Meeting',start:start.toISOString(),end:new Date(start.getTime()+Math.max(15,Number(m.duration)||45)*60000).toISOString(),description:[m.agenda||'',m.attendees?'Attendees: '+m.attendees:'',m.meetUrl?'Meet: '+m.meetUrl:''].filter(Boolean).join('\n'),location:m.location||'',all_day:false}}
function tentativeCalendarBody(v){const date=v.eventDate;if(!date)return null;const desc=[v.person?'Person: '+v.person:'',v.kind?'Type: '+v.kind:'',v.status?'Status: '+v.status:''].filter(Boolean).join('\n');if(v.time){const start=isoFromIstDateTime(date,v.time);if(start)return {title:v.title||'Event',start,end:new Date(new Date(start).getTime()+60*60000).toISOString(),description:desc,location:v.location||'',all_day:false};}return {title:v.title||'Event',start:date,end:addDays(date,1),description:desc,location:v.location||'',all_day:true}}
function followupCalendarBody(f){if(!f.due)return null;const date=indiaDate(new Date(f.due));if(!date)return null;const desc=['Follow-up · '+(f.status||'Pending'),f.note||'',f.person?'Person: '+f.person:''].filter(Boolean).join('\n');return {title:'Follow-up: '+(f.title||''),start:date,end:addDays(date,1),description:desc,location:'',all_day:true}}
function googleCalendarReady(){const g=edaGoogle();return !!(g.connected&&g.calendar_scope)&&data.preferences?.googleSync!==false&&!!(window.edaCloud&&window.edaCloud.calendarCreate)}
function googleSyncRecords(){const out={};for(const t of (data.tasks||[])){if(t.demo||t.status==='Cancelled')continue;const b=taskCalendarBody(t);if(b)out['task:'+t.id]={body:b,hash:JSON.stringify(b)};}for(const m of (data.meetings||[])){if(m.status==='Cancelled')continue;const b=meetingCalendarBody(m);if(b)out['meeting:'+m.id]={body:b,hash:JSON.stringify(b)};}for(const v of (data.tentativeEvents||[])){if(v.demo||v.status==='Cancelled')continue;const b=tentativeCalendarBody(v);if(b)out['event:'+v.id]={body:b,hash:JSON.stringify(b)};}for(const f of (data.followups||[])){if(f.status==='Completed'||f.status==='Cancelled')continue;const b=followupCalendarBody(f);if(b)out['followup:'+f.id]={body:b,hash:JSON.stringify(b)};}return out}

annot read, send or delete your mail.</small></div></section><section class="panel google-integration-card"><span class="google-integration-icon">${icon('bell')}</span><div><h2>Background notifications</h2>${pushReady?'<span class="tag">Server push ready</span>':'<span class="google-notlive">Server push unavailable</span>'}<p>${supported?`Browser permission: <b>${esc(perm)}</b>. Subscribed devices: <b>${devices}</b>.`:'This browser cannot show background notifications.'}</p><div class="google-form-actions">${devices>0?`<button class="btn subtle" data-action="push-disable">Turn off on this device</button><button class="btn subtle" data-action="push-test">Send test notification</button>`:`<button class="btn" data-action="push-enable">${icon('bell')} Enable on this device</button>`}</div><small class="google-help">${pushReady?'Reminders for tasks and meetings due within 10 minutes are pushed by the server even when this tab is closed.':'The server could not start Web Push (pywebpush or VAPID keys missing).'}</small></div></section></div><div class="panel google-security-note"><h2>How your data is protected</h2><p>Google tokens live only in this server's database, are refreshed automatically, and are deleted the moment you disconnect. Sign-in and calendar calls go directly to Google's official endpoints. Nothing is shared with third parties.</p></div>`}

function classifyFollow(f){if(f.status==='Cancelled')return 'Cancelled';if(f.status==='Completed')return 'Completed';if(f.status==='Waiting for response')return 'Waiting';if(!f.due)return 'No date';const d=indiaDate(new Date(f.due)),today=indiaDate();return d<today?'Overdue':d===today?'Due Today':'Upcoming'}
function followSortValue(f){if(!f.due)return 8.64e15;const t=new Date(f.due).getTime();return Number.isNaN(t)?8.64e15:t}
function followDueLabel(f){if(!f.due)return 'No Date';const d=new Date(f.due);if(Number.isNaN(d.getTime()))return 'No Date';const timed=String(f.due).includes('T');const opts=timed?{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}:{day:'numeric',month:'short',year:'numeric'};return d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',...opts})}
function followLastContactedLabel(f){return f.lastContacted?dateOnly(f.lastContacted):'—'}
function followPriorityLabel(f){return f.priority||'Medium'}
function followSearchText(f){return [f.title,f.person,f.company,f.subject,f.note,f.status,f.due?followDueLabel(f):'',f.due?indiaDate(new Date(f.due)):'',f.lastContacted?indiaDate(new Date(f.lastContacted)):'',f.nextCheck?indiaDate(new Date(f.nextCheck)):''].join(' ').toLowerCase()}
function followSourceLabel(f){if(f.relatedType&&f.relatedId){const r=allRecords().find(x=>x.type===f.relatedType&&x.id===String(f.relatedId));if(r)return r.type+' · '+(r.title||'')}if(f.sourceInstruction){const orig=data.instructions.find(x=>x.id===f.sourceInstruction);if(orig)return 'Executive Memory'}return 'Manual'}
function followHistoryRecords(status){return data.followups.filter(f=>status==='Completed'?f.status==='Completed':status==='Cancelled'?f.status==='Cancelled':false).map(f=>({...f}))}
function followTrashRecords(){return (data.trash||[]).filter(t=>t.recordType==='Follow-ups').map(t=>({...t.record,trashId:t.id,deletedAt:t.deletedAt}))}
function followupsPage(){
 const types=['All','Due Today','Overdue','Waiting','Upcoming','No Date','Completed','Cancelled'];
 const counts=Object.fromEntries(types.map(t=>[t,t==='All'?data.followups.length:data.followups.filter(f=>classifyFollow(f)===t).length]));
 const q=String(ui.followQuery||'').toLowerCase().trim();
 const month=ui.followMonth||'';
 const isHistory=ui.followView==='history';
 let list=[];
 if(isHistory){
  if(ui.followHistoryTab==='Trash')list=followTrashRecords();
  else list=followHistoryRecords(ui.followHistoryTab);
 }else{
  list=data.followups.filter(f=>{
   if(ui.followFilter!=='All'&&classifyFollow(f)!==ui.followFilter)return false;
   const date=f.due?indiaDate(new Date(f.due)):'';
   if(month&&(!date||date.slice(0,7)!==month))return false;
   if(q&&!followSearchText(f).includes(q))return false;
   return true;
  }).sort((a,b)=>{
   if(ui.followSort==='name')return a.title.localeCompare(b.title);
   if(ui.followSort==='person')return String(a.person||'').localeCompare(String(b.person||''));
   return followSortValue(a)-followSortValue(b);
  });
 }

function fmtMinute(n){const h=Math.floor(n/60),m=n%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function buildPlan(selected=ui.planDate){
 const officeStart=540,officeEnd=1050,allMeetings=data.meetings.filter(m=>m.at&&indiaDate(new Date(m.at))===selected).map(m=>({start:indiaMinutes(m.at),end:indiaMinutes(m.at)+Math.min(240,Math.max(15,Number(m.duration)||45)),title:m.title,type:'Meeting',id:m.id})).sort((a,b)=>a.start-b.start);
 const warnings=[];
 if(allMeetings.some(m=>m.start<officeStart||m.end>officeEnd))warnings.push('A meeting is outside the normal 9:00–5:30 workday. Review the meeting time.');
 for(let i=1;i<allMeetings.length;i++)if(allMeetings[i].start<allMeetings[i-1].end)warnings.push('Meeting conflict: '+allMeetings[i-1].title+' overlaps '+allMeetings[i].title+'.');
 const lunch={start:780,end:810,title:'Lunch & break',type:'Break'};
 let freeStart=officeStart;
 if(selected===indiaDate()){
  const now=istParts();const minutes=Number(now.hour)*60+Number(now.minute);
  freeStart=Math.max(officeStart,Math.ceil(minutes/15)*15);
  if(freeStart>=officeEnd)warnings.push('The working day has ended. Choose the next working day to schedule new tasks.');
 }
 if([0,6].includes(new Date(selected+'T12:00:00Z').getUTCDay()))warnings.push('Selected date is a weekend. Your normal workdays are Monday–Friday.');
 const blocks=[...allMeetings.map(x=>({...x,end:x.end+10})),lunch].sort((a,b)=>a.start-b.start);
 let free=[];let last=freeStart;
 for(const m of blocks){const a=Math.min(officeEnd,Math.max(freeStart,m.start)),b=Math.max(freeStart,Math.min(officeEnd,m.end));if(a>last)free.push([last,a]);last=Math.max(last,b)}
 if(last<officeEnd)free.push([last,officeEnd]);
 const candidates=orderTasks(data.tasks.filter(t=>t.status!=='Completed'));
 const planned=[],omitted=[];
 for(const t of candidates){const duration=Math.min(240,Math.max(10,Number(t.estimate)||30));let deadline=null;
  if(t.due&&indiaDate(new Date(t.due))===selected)deadline=indiaMinutes(t.due);
  if(t.due&&indiaDate(new Date(t.due))<selected)warnings.push('Overdue task: '+t.title+'. Its original deadline has passed.');
  const slot=free.find(w=>w[1]-w[0]>=duration&&(deadline===null||w[0]+duration<=deadline));
  if(!slot){omitted.push({...t,reason:deadline!==null?'Cannot fit before its deadline':'Not enough free time'});continue}
  planned.push({start:slot[0],end:slot[0]+duration,title:t.title,id:t.id,type:'Task',priority:t.priority});slot[0]+=duration+5;
 }
 return {date:selected,events:[...allMeetings,lunch,...planned].sort((a,b)=>a.start-b.start),omitted,warnings:[...new Set(warnings)],minutes:planned.reduce((a,b)=>a+b.end-b.start,0),tasksPlanned:planned.length,generatedAt:new Date().toISOString()};
}
function dayJournal(date){
 if(!data.dailyJournals||typeof data.dailyJournals!=='object')data.dailyJournals={};
 if(!data.dailyJournals[date])data.dailyJournals[date]={entries:[],notes:'',updatedAt:''};
 if(!Array.isArray(data.dailyJournals[date].entries))data.dailyJournals[date].entries=[];
 return data.dailyJournals[date];
}

function pendingLibrary(){

 return allRecords().filter(r=>groups[plannerRecordGroup(r.type)]?.includes(r.type)).filter(r=>{
  const status=plannerStatus(r.type,r.item||{});
  return status==='Pending'&&!['Approved','Rejected'].includes(String(r.item?.status||''));
 }).map(r=>{
  const x=r.item||{};
  return {type:r.type,group:plannerRecordGroup(r.type),id:r.id,title:r.title,at:plannerDateValue(r.type,x)||'',priority:x.priority||'',person:x.person||x.from||x.company||x.contact||'',detail:r.body||'',status:'Pending'};
 }).sort((a,b)=>{

  let da=calendarDay(a.at)||'9999-01-01', db=calendarDay(b.at)||'9999-01-01';

 });
}
function plannerSourceGroups(){return ['All','Tasks','Meetings','Follow-ups','Calendar','CRM','Gmail','Notes','Memory','Travel','Events','Vendors','MOM','Approvals'];}
function plannerSourceMap(){return {'Tasks':['Tasks'],'Meetings':['Meetings'],'Follow-ups':['Follow-ups'],'Calendar':['Tentative Events'],'CRM':['Clients'],'Gmail':['Email Records','Email Drafts'],'Notes':['Quick Notes','Daily Notes'],'Memory':['Instructions','Calls'],'Travel':['Travel'],'Events':['Events'],'Vendors':['Vendors'],'MOM':['MOM'],'Approvals':['Approvals']};}

function plannerDateValue(type,item){if(type==='Tasks')return item.targetDate||item.calendarDate||item.due||'';if(type==='Meetings')return item.at||'';if(type==='Follow-ups')return item.due||'';if(type==='Tentative Events')return item.eventDate||'';if(type==='Quick Notes')return item.remindOn||'';if(type==='Daily Notes')return item.date||'';if(type==='Clients')return item.next||'';if(type==='Travel')return item.start||'';if(type==='Events')return item.date||'';if(type==='MOM')return item.deadline||'';if(type==='Approvals')return item.due||item.date||'';if(type==='Email Records')return item.dueDate||'';if(type==='Reminders')return item.eventDate||'';return data.plannerDates?.[type+':'+item.id]||'';}
function plannerDateField(type,item={}){if(type==='Tasks')return 'targetDate';if(type==='Meetings')return 'at';if(type==='Follow-ups')return 'due';if(type==='Tentative Events')return 'eventDate';if(type==='Quick Notes')return 'remindOn';if(type==='Clients')return 'next';if(type==='Travel')return 'start';if(type==='Events')return 'date';if(type==='MOM')return 'deadline';if(type==='Approvals')return item.due!==undefined?'due':'date';if(type==='Email Records')return 'dueDate';if(type==='Reminders')return 'eventDate';return 'plannerDate';}
function plannerTitleField(type){return ({Tasks:'title',Meetings:'title','Follow-ups':'title','Tentative Events':'title','Quick Notes':'title',Instructions:'text',Calls:'text',MOM:'meetingTitle',Clients:'name',Travel:'title',Events:'title',Vendors:'name',Approvals:'title','Email Records':'subject','Email Drafts':'subject',Reminders:'title'})[type]||'';}
function plannerDetailsField(type){return ({Meetings:'agenda','Follow-ups':'note','Tentative Events':'location','Quick Notes':'body','Daily Notes':'body',Instructions:'text',Calls:'text',MOM:'notes',Clients:'note',Travel:'notes',Events:'note',Vendors:'note',Approvals:'note','Email Records':'summary','Email Drafts':'body',Reminders:'note'})[type]||'';}

function plannerReschedule(type,id){
 const item=plannerSourceItem(type,id),field=item&&plannerDateField(type,item);
 if(!item||!field){toast('This source has no date that can be rescheduled.');return}
 const current=plannerDateValue(type,item),oldDay=calendarDay(current);
 let oldTime='';
 if(type==='Tasks')oldTime=item.calendarTime||'';
 else if(type==='Tentative Events')oldTime=item.time||'';
 else if(type==='Meetings'&&item.at)oldTime=istInputValue(item.at).slice(11,16);
 else if(type==='Follow-ups'&&item.due&&String(item.due).includes('T'))oldTime=istInputValue(item.due).slice(11,16);
 const value=prompt('Enter the new date (YYYY-MM-DD) and optional time (HH:MM).',oldDay+(oldTime?' '+oldTime:''));
 if(value===null)return;
 const parsed=parseScheduleInput(value);
 if(!parsed){toast('Enter a date like 2026-11-20 or 2026-11-20 15:30.');return}
 const before=cloneRecord(item),date=parsed.date,time=parsed.time;
 if(type==='Meetings')item.at=isoFromIstDateTime(date,time||oldTime||'09:00');
 else if(type==='Follow-ups')item.due=time?isoFromIstDateTime(date,time):date;
 else if(type==='Tasks'){item.targetDate=date;item.calendarTime=time||''}
 else if(type==='Tentative Events'){item.eventDate=date;item.time=time||null}
 else if(type==='Travel'){item.start=date;if(item.end&&item.end<date)item.end=date}
 else if(field==='plannerDate')data.plannerDates[type+':'+id]=date;
 else item[field]=date;
 logActivity(type,id,item.title||item.subject||item.name||item.meetingTitle||'Record','Rescheduled',before,item);
 persist();toast('Pending work rescheduled.');
}

 if(n.type==='Tasks'){r.targetDate=date;r.calendarTime=time||'';r.due=time?isoFromIstDateTime(date,time):null;r.updatedAt=new Date().toISOString();logActivity('Tasks',r.id,r.title,'Rescheduled from reminder',null,{targetDate:date,calendarTime:time})}
 else if(n.type==='Meetings'){const iso=isoFromIstDateTime(date,time||(r.at?istInputValue(r.at).slice(11,16):'')||'09:00');if(!iso)return false;r.at=iso;logActivity('Meetings',r.id,r.title,'Rescheduled from reminder',null,{at:iso})}
 else if(n.type==='Follow-ups'){r.due=time?isoFromIstDateTime(date,time):date;logActivity('Follow-ups',r.id,r.title,'Rescheduled from reminder',null,{due:r.due})}
 else if(n.type==='Daily Plan'){const from=data.dailyJournals?.[n.date];if(!from)return false;const idx=(from.entries||[]).findIndex(e=>e.id===n.rid);if(idx<0)return false;const entry=from.entries.splice(idx,1)[0];const before=cloneRecord(entry);entry.time=time||'';const dest=data.dailyJournals[date]||(data.dailyJournals[date]={entries:[],notes:''});if(!Array.isArray(dest.entries))dest.entries=[];dest.entries.push(entry);logActivity('Daily Plan',entry.id,entry.title,'Rescheduled from reminder',{...before,dayDate:n.date},{...entry,dayDate:date})}
 else if(n.type==='Tentative Events'){r.eventDate=date;r.time=time||null;logActivity('Tentative Events',r.id,r.title,'Rescheduled from reminder',null,{eventDate:date,time:time||null})}
 else if(n.type==='Travel'){r.start=date;if(!r.end||r.end<date)r.end=date;logActivity('Travel',r.id,r.title,'Rescheduled from reminder',null,{start:date})}
 else if(n.type==='Events'){r.date=date;logActivity('Events',r.id,r.title,'Rescheduled from reminder',null,{date})}
 else if(n.type==='MOM'){r.deadline=date;logActivity('MOM',r.id,r.meetingTitle,'Deadline rescheduled from reminder',null,{deadline:date})}
 else if(n.type==='Clients'){r.next=date;logActivity('Clients',r.id,r.name,'Next action rescheduled from reminder',null,{next:date})}
 else if(n.type==='Quick Notes'){r.remindOn=date;r.updatedAt=new Date().toISOString();logActivity('Quick Notes',r.id,r.title||String(r.body||'').slice(0,50),'Reminder rescheduled',null,{remindOn:date})}
 else return false;return true}catch(e){return false}}
function notifReschedule(id){const n=makeNotifications().find(x=>x.id===id);if(!n){toast('This reminder is no longer available.');return}const input=prompt('Reschedule “'+(n.text||n.title||'')+'”\nEnter the new date (YYYY-MM-DD) with an optional time (HH:MM).',notifScheduleText(n));if(input===null)return;const parsed=parseScheduleInput(input);if(!parsed){toast('Enter a date like 2026-11-20 or 2026-11-20 15:30.');return}if(!applyNotifReschedule(n,parsed)){toast('Could not reschedule this reminder.');return}clearNotifOverrides(id);ui.notifOpen=true;persist();toast('Reminder rescheduled.')}

 }

 data.trash.unshift(tr);data[key]=data[key].filter(x=>String(x.id)!==String(id));logActivity(type,r.id,tr.title,'Moved to Trash',r,null);
 ui.editTaskId=null;ui.editMeetingId=null;ui.editQuickNoteId=null;ui.editEventId=null;ui.editVendorId=null;ui.editMomId=null;ui.memoryEditId=null;ui.modal=null;ui.selectedRecord=null;persist();toast('Moved to Trash.');

 }
 const map={'Tasks':'tasks','Meetings':'meetings','Quick Notes':'quickNotes','Follow-ups':'followups','Email Records':'communicationRecords','Email Drafts':'emailDrafts','Events':'events','Vendors':'vendors','MOM':'meetingNotes','Instructions':'instructions','Calls':'instructions','Tentative Events':'tentativeEvents','Clients':'clients','Travel':'trips','Reminders':'reminderRules','Approvals':'approvals','AI Conversations':'chatHistory','Plans':'savedPlans'};
 if(tr.recordType==='Reports/MIS'){

 }
 const key=tr.recordType==='Reports/MIS'?tr.recordCollection:map[tr.recordType];if(!key||!Array.isArray(data[key]))return;
 if(!data[key].some(x=>String(x.id)===String(tr.record.id)))data[key].unshift(cloneRecord(tr.record));
 data.trash=data.trash.filter(x=>x.id!==id);logActivity(tr.recordType,tr.record.id,tr.title,'Restored from Trash',null,tr.record);ui.selectedRecord=null;persist();toast('Restored to '+tr.recordType);

function v11HomeUpcoming(){
 const from=indiaDate();

 // Upcoming begins tomorrow; today's plan is already shown separately.
 const entries=[];
 const add=(type,recordType,items,getDate,getTitle,include=()=>true)=>{
  (items||[]).forEach(x=>{
   if(!include(x))return;
   const date=calendarDay(getDate(x));
   if(date>from&&date<=max)entries.push({date,title:String(getTitle(x)||'Untitled'),type,id:x.id,recordType});
  });
 };
 add('Calendar','Meetings',data.meetings,x=>x.at,x=>x.title,x=>x.status!=='Cancelled');
 add('Calendar','Tentative Events',data.tentativeEvents,x=>x.eventDate,x=>x.title,x=>x.status!=='Cancelled');
 add('Tasks','Tasks',data.tasks,taskCalendarDate,x=>x.title,x=>x.status!=='Completed'&&x.status!=='Cancelled');
 add('Follow-ups','Follow-ups',data.followups,x=>x.due,x=>x.title,x=>x.status!=='Completed'&&x.status!=='Cancelled');
 add('Notes','Quick Notes',data.quickNotes,x=>x.remindOn,x=>x.title||x.body.slice(0,72));
 add('Memory','Instructions',data.instructions,x=>x.remindOn||x.targetDate,x=>x.text?.slice(0,90),x=>!/(phone|call)/i.test(x.source||''));
 add('Memory','Calls',data.instructions,x=>x.remindOn||x.targetDate,x=>x.text?.slice(0,90),x=>/(phone|call)/i.test(x.source||''));
 add('Gmail','Email Records',data.communicationRecords,x=>x.dueDate,x=>x.subject,x=>x.status!=='Completed');
 add('Travel','Travel',data.trips,x=>x.start,x=>x.title,x=>x.status!=='Cancelled');
 add('Events','Events',data.events,x=>x.date,x=>x.title,x=>x.status!=='Cancelled');
 return entries.sort((a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title));
}

function edaHomeDay(value){
 if(!value)return '';

 if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
 if(/^\d{4}-\d{2}-\d{2}T/.test(v)){
  const d=new Date(v);return Number.isFinite(d.getTime())?indiaDate(d):'';
 }
 return '';
}
function edaHomeTime(value){

 if(/^\d{2}:\d{2}$/.test(s))return formatClock(s);

 return Number.isFinite(d.getTime())?dateTime(d,{hour:'numeric',minute:'2-digit'}):'Time not set';

  }
 };

 add('Meeting','Tentative Events',data.tentativeEvents,r=>r.eventDate,r=>r.title,{time:r=>r.time});
 add('Task','Tasks',data.tasks,taskCalendarDate,r=>r.title,{time:r=>r.calendarTime||(/T/.test(String(r.due||''))?r.due:'')});
 add('Follow-up','Follow-ups',data.followups,r=>r.due,r=>r.title||r.subject,{time:r=>r.dueTime||(/T/.test(String(r.due||''))?r.due:'')});
 add('CRM','Clients',data.clients,r=>r.nextContactDate||r.nextContact||r.followUpDate||r.next,r=>r.name||r.company,{time:r=>r.nextContactTime});

function capISO(date){if(!date)return '';const p=String(date).split('-').map(Number);return p.length===3?String(p[0]).padStart(4,'0')+'-'+String(p[1]).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0'):'';}
function smartDate(clause){
 const text=clause.toLowerCase().replace(/tommorow|tomorow|tommorrow/g,'tomorrow');const now=indiaDate();
 if(/\btomorrow\b/.test(text))return plusIstDays(now,1);
 if(/\btoday\b/.test(text))return now;
 const months={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
 let m=text.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s,\-/]+(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?:[\s,\-/]+(20\d\d))?\b/i);
 if(m){const day=Number(m[1]),month=months[m[2].slice(0,3).toLowerCase()];let year=Number(m[3])||Number(now.slice(0,4));if(!m[3]&&`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`<now)year++;const d=new Date(Date.UTC(year,month-1,day,12));if(d.getUTCMonth()===month-1&&d.getUTCDate()===day)return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;return ''}
 m=text.match(/\b(?:next\s+)(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);
 if(m){const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];const d=new Date(now+'T12:00:00Z');let delta=(days.indexOf(m[1])-d.getUTCDay()+7)%7;if(!delta)delta=7;return plusIstDays(now,delta)}
 return '';
}
function smartSuggestFollow(date){if(!date)return '';let until=Math.round((Date.parse(date+'T12:00:00Z')-Date.parse(indiaDate()+'T12:00:00Z'))/86400000);let due=plusIstDays(date,until>7?-7:-1);const val=due+'T17:30';return due>=indiaDate() && (! (due===indiaDate()&&Number(istParts().hour)*60+Number(istParts().minute)>1050))?val:''}
function smartTime(clause){const x=clause.match(/\b(?:at|around|by)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);if(x){let h=Number(x[1])%12+(x[3].toLowerCase()==='pm'?12:0);return String(h).padStart(2,'0')+':'+String(Number(x[2]||0)).padStart(2,'0')}const y=clause.match(/\b(?:at|around)\s*([01]?\d|2[0-3]):([0-5]\d)\b/);return y?y[1].padStart(2,'0')+':'+y[2]:''}
function smartClauses(text){return text.replace(/\b(?:and\s+he\s+said|and\s+she\s+said|and\s+then|then\s+said|then|also)\b/gi,'\n').split(/\n|[.;]+/).map(x=>x.trim().replace(/^\s*(?:sir\s+)?(?:asked\s+me\s+to|said\s+that|said|he\s+said)\s*/i,'').trim()).filter(Boolean).slice(0,12)}
function smartAnalyze(text){
 return smartClauses(text).map((raw)=>{
  const original=raw.trim();let kind='Task';
  if(/book\s+(?:flight|train|bus|travel|ticket)|(?:flight|train)\s+tickets?|tickets?\s+(?:for|on)/i.test(raw))kind='Travel';
  else if(/\b(lunch|dinner|breakfast)\b/i.test(raw))kind='Lunch';
  else if(/\b(meet|meeting|appointment|catch\s+up|interview)\b/i.test(raw))kind='Meeting';
  else if(/\b(call|phone|ring)\b/i.test(raw))kind='Call';
  const date=smartDate(raw);const time=smartTime(raw);const place=raw.match(/\b(?:at|in|near)\s+(Worli|Andheri|Lower Parel|Bandra|BKC|Nariman Point|Powai|Dadar|Churchgate|Mumbai|Delhi|Pune|Thane)\b/i);
  const location=place?place[1].replace(/\b\w/g,z=>z.toUpperCase()):'';
  const person=raw.match(/\b(?:client|partner|with|meet)\s+([a-z]{2,25})\b/i);const candidate=person?.[1]||'';const picked=candidate&&!['andheri','worli','december','tomorrow','partner','client','the','his','her','at','on','in','my','our','a','an'].includes(candidate.toLowerCase())?candidate.charAt(0).toUpperCase()+candidate.slice(1):'';
  const normalized=raw.replace(/^his\s+/i,'').replace(/^he\s+(?:said\s+)?(?:wants?\s+to\s+)?/i,'').trim();
  let title=normalized.replace(/^\w/,c=>c.toUpperCase());
  if(kind==='Travel'&&/book\s+ticket/i.test(raw))title='Book tickets'+(date?' for '+new Date(date+'T12:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'long',timeZone:'UTC'}):'');
  if(kind==='Meeting'&&picked)title='Meeting with '+picked+(location?' · '+location:'');
  if(kind==='Lunch')title='Partner lunch'+(location?' · '+location:'');
  let warning=kind==='Travel'?'Travel date is not a booking deadline. Confirm route, traveller, booking details and the actual booking deadline.':kind==='Meeting'||kind==='Lunch'?'Tentative until time, participants and venue are confirmed.':'Confirm the details before creating or completing the task.';
  if(!date)warning+=' No date detected; add it if known.';
  if(date&&!time&&(kind==='Meeting'||kind==='Lunch'))warning+=' No time was given; it will remain date-only.';
  const contactNeeded=/(follow[\s-]?up|confirm|confirmation|reply|respond|response|call|phone|ring|email|reach\s*out|contact|ping|whatsapp|message|send|submit|kyc|documents?|remind|chase|nudge|booking)/i.test(raw);
  const follow=(kind==='Travel'||kind==='Meeting'||kind==='Lunch'||kind==='Call')&&!(/prepare|draft|make|create|write|design|build|compile|analyse|analyze|research|review\s+(report|ppt|deck)|read|study/i.test(raw)&&!contactNeeded);
  return {raw:original,title,kind,date,time,location,person:picked,priority:kind==='Travel'?'High':'Medium',follow,warning};
 });
}

document.addEventListener('input',e=>{
 if(!['memorysearch','globalSearch'].includes(e.target.id))return;
 e.stopImmediatePropagation();
 const memory=e.target.id==='memorysearch',value=e.target.value,pos=e.target.selectionStart;
 if(memory){ui.memoryQuery=value;ui.memoryLimit=40}else{ui.searchQuery=value;ui.searchLimit=40}
 render();const input=document.getElementById(memory?'memorysearch':'globalSearch');input?.focus();input?.setSelectionRange(pos,pos);
},true);
document.addEventListener('change',e=>{
 if(e.target.id==='memory-category'){e.stopImmediatePropagation();memorySetCategory(e.target.value);return}
 if(e.target.id==='memory-month'){e.stopImmediatePropagation();ui.memoryMonth=e.target.value||'';ui.memoryLimit=40;render()}
},true);
document.addEventListener('submit',e=>{
 if(e.target.id!=='memory-add-form')return;
 e.preventDefault();e.stopImmediatePropagation();
 const f=new FormData(e.target),text=String(f.get('body')||'').trim(),title=String(f.get('title')||'').trim();
 if(!text){toast('Write a memory before saving.');return}
 const old=ui.memoryEditId?data.instructions.find(x=>x.id===ui.memoryEditId&&x.source==='Executive Memory'):null;
 const before=old?cloneRecord(old):null,now=new Date().toISOString();
 const record=old||{id:newId(),source:'Executive Memory',person:'',date:now,createdAt:now};
 Object.assign(record,{title,text,updatedAt:now});
 if(!old)data.instructions.unshift(record);
 logActivity('Instructions',record.id,title||text.slice(0,90),old?'Edited saved memory':'Added saved memory',before,record);
 ui.memoryEditId=null;ui.modal=null;ui.selectedRecord=null;save();render();toast(old?'Memory updated.':'Memory saved to Executive Memory.');
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.mobilePlannerPanel){ui.mobilePlannerPanel=null;render();return}if(e.key==='Escape'&&(ui.notifOpen||ui.selectedRecord)){ui.notifOpen=false;ui.selectedRecord=null;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();nav('Search');document.querySelector('#globalSearch')?.focus()}});
